<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniTube</title>
<style>
body {
  margin: 0;
  background: #0f0f0f;
  color: white;
  font-family: Arial, sans-serif;
}
header {
  padding: 18px;
  font-size: 25px;
  font-weight: bold;
  color: #ff4545;
}
main { padding: 16px; }
input {
  width: 100%;
  box-sizing: border-box;
  padding: 14px;
  border-radius: 24px;
  border: 1px solid #555;
  background: #222;
  color: white;
  font-size: 16px;
}
button {
  margin-top: 12px;
  padding: 12px 20px;
  border: none;
  border-radius: 24px;
  background: #ff4545;
  color: white;
  font-size: 16px;
}
.note {
  color: #bbb;
  line-height: 1.7;
}
</style>
</head>
<body>
<header>▶ MiniTube</header>
<main>
  <h2>動画を探そう</h2>
  <form id="search">
    <input id="q" placeholder="見たい動画を入力..." required>
    <button type="submit">YouTubeで検索</button>
  </form>
  <p class="note">
    検索するとYouTube公式サイトが開きます。
  </p>
</main>
<script>
document.getElementById("search").addEventListener("submit", function(e) {
  e.preventDefault();
  const q = document.getElementById("q").value.trim();
  if (!q) return;
  location.href = "https://www.youtube.com/results?search_query=" + encodeURIComponent(q);
});
</script>
</body>
</html>
